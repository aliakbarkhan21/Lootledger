<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=glass" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=glass" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=glass" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png?v=glass" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9efe0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b2118" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest?v=glass" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=glass" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Loot Ledger" />
    <link rel="stylesheet" href="/fonts/spectral.css" />
    <link rel="stylesheet" href="/fonts/courier-prime.css" />
    <link rel="stylesheet" href="/fonts/bricolage-grotesque.css" />
    <script>
      // The Glass style paints its own backdrop, so mark the page before the
      // first frame rather than after React mounts; otherwise a Glass board
      // opens on one frame of the journal's desk. The journal (the default)
      // is left exactly as it loads today.
      (function () {
        function stored(k) {
          try { return localStorage.getItem(k); } catch (e) { return null; } /* storage blocked */
        }
        var q = new URLSearchParams(location.search);
        var s = q.get('style');
        if (s !== 'glass' && s !== 'journal') s = stored('ll-style');
        if (s !== 'glass') return;
        var t = q.get('theme');
        if (t !== 'light' && t !== 'dark') t = stored('ll-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-style', 'glass');
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <title>Loot Ledger</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
