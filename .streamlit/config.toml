[server]
# Rerun the open session when a source file is saved.
#
# Not a convenience. app.py is exec'd from disk on every run, so its edits are
# always live — but theme.py is IMPORTED, and Python caches imported modules in
# sys.modules, so a later `import theme` is a dict lookup rather than a re-read
# of the file. Streamlit handles this by queueing changed modules for eviction
# from sys.modules and flushing the queue at the start of the next script run;
# the queue, however, lives on the watcher, and the watcher belongs to the
# session that was open when the file was saved. Reload the tab and that
# session may be rebuilt rather than resumed, in which case the new session's
# queue is empty while sys.modules still holds the stale module. The stylesheet
# then silently stays as it was, which reads as CSS that will not apply.
#
# A rerun inside the SAME session is what flushes the queue, and this is what
# schedules one. The other route to it — the "Source file changed" prompt and
# the R shortcut — is closed by toolbarMode = "viewer" below, on purpose.
#
# The cost: every save reruns every open session, a phone included. Nothing on
# disk changes during ordinary use, so in practice this only fires while the
# app is being worked on.
runOnSave = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 500
# Serves ./static/* at /app/static/* — needed for the PWA manifest and its
# icons, which the browser fetches directly rather than through Streamlit's
# own script-serving machinery.
enableStaticServing = true

[client]
# Developer mode is what binds Streamlit's "C" = clear caches and "R" = rerun
# shortcuts, and pressing C while typing anywhere outside a text box fired the
# clear-caches overlay. This is a finished app being used, not one being
# debugged, so the developer toolbar and its shortcuts are switched off.
toolbarMode = "viewer"

# Which origins may drive this app over Streamlit's host-communication channel.
# Set because themesync.html uses it: the board's light/dark toggle hands
# Streamlit a new theme at runtime so the canvas-painted tables repaint in place
# instead of the page being reloaded. That message is only accepted from an
# origin listed here, and it is the app posting to ITSELF, so these are just the
# addresses this app is served from. Wildcards are supported and the port may be
# one. 100.* is the Tailscale range, for reaching the board from a phone.
#
# Setting this REPLACES Streamlit's built-in list, so the Community Cloud
# entries are repeated here — without them the deployed copy loses the same
# channel. Deliberately not "http://*": that would let any page which framed
# this one drive it.
allowedOrigins = [
  "http://localhost:*",
  "http://127.0.0.1:*",
  "http://100.*",
  "https://*.streamlit.app",
  "https://share.streamlit.io",
]

# The Departure Board world is a dark enamel panel, and committing that here
# stops Streamlit's own light default from fighting the stylesheet on first paint.
#
# Split into [theme.light] and [theme.dark] because two widgets cannot be themed
# by CSS at all: st.dataframe and st.data_editor paint their cells to a <canvas>
# from a JavaScript theme Streamlit builds out of THIS file. With one pinned
# palette here, every ledger and debt table stayed a black slab in light mode
# whatever the stylesheet said. Streamlit picks between the two blocks from the
# viewer's active theme, which themesync.html keeps in step with the board's own
# light/dark toggle. These values mirror the tokens in theme.py — background is
# the panel colour rather than the page void, since it is grid cells it lands on.
#
# baseRadius / buttonRadius match --radius in theme.py. They are set here
# because this file is the ONLY lever on the canvas grids' corners — and
# because Streamlit paints a handful of surfaces (the expander shell, the
# uploader button, portalled dropdowns) from these values before the stylesheet
# reaches them, so a mismatch shows as one square widget in a soft page.
#
# Keep in step with theme.STREAMLIT_THEME, which is the runtime copy. Streamlit
# reads this file at boot, before any of the app imports, so it cannot be
# generated from Python.
[theme]
base = "dark"
font = "sans serif"

[theme.dark]
primaryColor = "#FFB300"
backgroundColor = "#07090C"
secondaryBackgroundColor = "#0E1116"
textColor = "#E9EDF2"
baseRadius = "10px"
buttonRadius = "10px"

[theme.light]
primaryColor = "#A85D00"
backgroundColor = "#FBF8F0"
secondaryBackgroundColor = "#F3EDE0"
textColor = "#1A1712"
baseRadius = "10px"
buttonRadius = "10px"
