<!doctype html>
<!-- Source of the Loot Ledger mark: a page of the night ledger (dark green
     paper, faint ruling, the double red head rule and margin line) with an
     italic gold LL in Spectral, the wordmark's face, over the double rule a
     ledger draws under a closing total.

     Each shipped size was screenshotted from this page with a transparent
     background (Playwright, element #icon at 512px) in the variant drawn for it:
       (none)      192px and up, and the .ico from 64px
       simple      32-48px: no ruling, heavier strokes
       tiny        16-24px: the .mark text set to a single L, under a thick red rule
       bleed,safe  the maskable and Apple touch icons: square, inset mark
     The .ico is written with make_icon.write_ico's container layout. -->
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../frontend/public/fonts/spectral.css" />
<style>
  html, body { margin: 0; background: transparent; }
  /* One design drawn at 512 and scaled; `simple` drops the fine ruling that
     turns to mush at favicon sizes. */
  .icon {
    position: relative;
    width: 512px;
    height: 512px;
    border-radius: 104px;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 30% 15%, #2b3824 0%, #1f281b 55%, #161c13 100%);
    box-shadow: inset 0 0 0 6px rgba(201, 160, 74, 0.28);
  }
  .icon.bleed { border-radius: 0; box-shadow: none; }
  /* Faint green ledger ruling. */
  .rules {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom, transparent 0 55px, rgba(111, 150, 98, 0.30) 55px 58px);
    background-position: 0 150px;
    -webkit-mask: linear-gradient(to bottom, transparent 150px, #000 150px);
  }
  /* Double red rule across the head of the page, and the red margin line. */
  .head-rule {
    position: absolute; left: 0; right: 0; top: 104px; height: 22px;
    border-top: 7px solid #b5493d; border-bottom: 7px solid #b5493d;
    box-sizing: border-box;
  }
  .margin {
    position: absolute; top: 0; bottom: 0; left: 118px; width: 22px;
    border-left: 6px solid rgba(181, 73, 61, 0.9); border-right: 6px solid rgba(181, 73, 61, 0.9);
    box-sizing: border-box;
  }
  .mark {
    position: absolute; left: 0; right: 0; top: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Spectral', Georgia, serif;
    font-style: italic; font-weight: 700;
    font-size: 330px; line-height: 1;
    letter-spacing: -46px;
    color: #d4aa55;
    padding: 40px 0 0 34px;
    text-shadow: 0 6px 0 rgba(0, 0, 0, 0.35), 0 18px 30px rgba(0, 0, 0, 0.45);
    -webkit-text-stroke: 5px #d4aa55;
  }
  .simple .rules { display: none; }
  .simple .head-rule { top: 84px; height: 34px; border-width: 12px; }
  .simple .margin { left: 96px; width: 16px; border-left-width: 16px; border-right: none; }
  .simple .mark { font-size: 400px; letter-spacing: -70px; padding: 70px 0 0 40px; -webkit-text-stroke: 12px #d4aa55; }
  .simple .totals { display: none; }
  .tiny .rules, .tiny .totals, .tiny .margin { display: none; }
  .tiny .head-rule { top: 70px; height: 56px; border-width: 22px; }
  .tiny .mark { font-size: 540px; padding: 96px 0 0 10px; -webkit-text-stroke: 16px #d4aa55; }
  .bleed.simple, .bleed .mark { }
  .safe .mark { font-size: 250px; letter-spacing: -36px; padding: 30px 0 0 26px; }
  .safe .totals { left: 166px; right: 118px; top: 372px; }
  /* The double rule a ledger draws under a closing total. */
  .totals {
    position: absolute; left: 128px; right: 70px; top: 404px; height: 20px;
    border-top: 6px solid #d4aa55; border-bottom: 6px solid #d4aa55; box-sizing: border-box;
    opacity: 0.9;
  }
</style>
</head>
<body>
  <div id="icon" class="icon">
    <div class="rules"></div>
    <div class="margin"></div>
    <div class="head-rule"></div>
    <div class="totals"></div>
    <div class="mark">LL</div>
  </div>
</body>
</html>
